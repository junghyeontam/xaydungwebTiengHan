name: Monorepo CI - Three Surfaces

on:
  push:
    branches: ["main", "refactor/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate-and-build:
    name: Typecheck, Lint, Boundary Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Turborepo Typecheck
        run: pnpm -r run typecheck

      - name: ESLint & Boundary Rules
        run: pnpm -r run lint

      - name: Monorepo Unit & Boundary Tests
        run: pnpm -r run test

      - name: Production Build (web, teach, admin)
        run: pnpm run build
        env:
          NEXT_PUBLIC_WEB_URL: "https://junghyeon.com"
          NEXT_PUBLIC_TEACH_URL: "https://teach.junghyeon.com"
          NEXT_PUBLIC_ADMIN_URL: "https://admin.junghyeon.com"
          NEXT_PUBLIC_COOKIE_DOMAIN: ".junghyeon.com"
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key-ci"

      - name: Verify Zero Client Secret Leaks
        run: node packages/testing/scripts/check-no-cycles.mjs
